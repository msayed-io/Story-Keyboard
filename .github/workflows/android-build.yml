name: Build and Release Story Keyboard APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-main
  cancel-in-progress: false

env:
  VERSION_CODE: ${{ github.run_number }}
  VERSION_NAME: 1.0.${{ github.run_number }}

jobs:
  build:
    name: Build signed Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify toolchain
        run: |
          java -version
          ./gradlew --version

      - name: Verify release signing secrets
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_KEYSTORE_BASE64" || { echo "Missing RELEASE_KEYSTORE_BASE64"; exit 1; }
          test -n "$RELEASE_STORE_PASSWORD" || { echo "Missing RELEASE_STORE_PASSWORD"; exit 1; }
          test -n "$RELEASE_KEY_PASSWORD" || { echo "Missing RELEASE_KEY_PASSWORD"; exit 1; }
          test -n "$RELEASE_KEY_ALIAS" || { echo "Missing RELEASE_KEY_ALIAS"; exit 1; }
          NORMALIZED_LENGTH="$(printf '%s' "$RELEASE_KEYSTORE_BASE64" | tr -d '[:space:]' | wc -c | tr -d ' ')"
          VALID_LENGTH="$(printf '%s' "$RELEASE_KEYSTORE_BASE64" | tr -d '[:space:]' | LC_ALL=C tr -cd 'A-Za-z0-9+/=' | wc -c | tr -d ' ')"
          INVALID_COUNT="$((NORMALIZED_LENGTH - VALID_LENGTH))"
          NORMALIZED_B64="$(printf '%s' "$RELEASE_KEYSTORE_BASE64" | tr -d '[:space:]')"
          BASE_PART="${NORMALIZED_B64%%=*}"
          PADDING_PART="${NORMALIZED_B64:${#BASE_PART}}"
          PADDING_COUNT="$(printf '%s' "$PADDING_PART" | tr -cd '=' | wc -c | tr -d ' ')"
          PADDING_ONLY="false"
          case "$PADDING_PART" in
            ''|'='|'==') PADDING_ONLY="true" ;;
          esac
          printf 'Keystore Base64 diagnostics: normalized_length=%s modulo_4=%s invalid_character_count=%s padding_count=%s padding_only_at_end=%s\n' \
            "$NORMALIZED_LENGTH" "$((NORMALIZED_LENGTH % 4))" "$INVALID_COUNT" "$PADDING_COUNT" "$PADDING_ONLY"
          echo "Release signing secrets are present."

      - name: Restore and verify release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          KEYSTORE_B64="$(printf '%s' "$RELEASE_KEYSTORE_BASE64" | tr -d '[:space:]')"
          case "$(( ${#KEYSTORE_B64} % 4 ))" in
            0) ;;
            2) KEYSTORE_B64="${KEYSTORE_B64}==" ;;
            3) KEYSTORE_B64="${KEYSTORE_B64}=" ;;
            *) echo "Invalid RELEASE_KEYSTORE_BASE64 length."; exit 1 ;;
          esac
          printf '%s' "$KEYSTORE_B64" | base64 --decode > app/release.keystore
          test -s app/release.keystore
          chmod 600 app/release.keystore
          keytool -list \
            -keystore app/release.keystore \
            -storepass "$RELEASE_STORE_PASSWORD" \
            -alias "$RELEASE_KEY_ALIAS" >/dev/null
          echo "Release keystore verified."

      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build release and debug APKs
        env:
          KEYSTORE_PATH: app/release.keystore
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon assembleRelease assembleDebug

      - name: Prepare release assets and metadata
        run: |
          set -euo pipefail
          RELEASE_APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | sort | head -n 1)"
          DEBUG_APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | sort | head -n 1)"
          test -n "$RELEASE_APK" && test -f "$RELEASE_APK"
          test -n "$DEBUG_APK" && test -f "$DEBUG_APK"
          rm -rf release-assets
          mkdir -p release-assets
          cp "$RELEASE_APK" release-assets/story-keyboard.apk
          cp "$DEBUG_APK" release-assets/story-keyboard-debug.apk
          APK_SHA256="$(sha256sum release-assets/story-keyboard.apk | awk '{print $1}')"
          APK_SIZE="$(wc -c < release-assets/story-keyboard.apk | tr -d ' ')"
          cat > release-assets/latest.json <<EOF
          {
            "applicationId": "com.aistudio.hikayatkey.pqsjlw",
            "versionCode": $VERSION_CODE,
            "versionName": "$VERSION_NAME",
            "downloadUrl": "https://github.com/${{ github.repository }}/releases/latest/download/story-keyboard.apk",
            "directDownloadUrl": "https://github.com/${{ github.repository }}/releases/download/v$VERSION_NAME/story-keyboard.apk",
            "sha256": "$APK_SHA256",
            "fileSizeBytes": $APK_SIZE,
            "mandatory": false,
            "commit": "${{ github.sha }}",
            "publishedAt": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          }
          EOF
          jq empty release-assets/latest.json
          {
            echo "## Story Keyboard $VERSION_NAME"
            echo
            echo "- Automatic build from commit $GITHUB_SHA"
            echo "- APK SHA-256: $APK_SHA256"
            echo "- APK size: $APK_SIZE bytes"
          } > release-assets/release-notes.md

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: story-keyboard-build-${{ env.VERSION_NAME }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Story Keyboard ${{ env.VERSION_NAME }}
          body_path: release-assets/release-notes.md
          prerelease: false
          files: |
            release-assets/story-keyboard.apk
            release-assets/story-keyboard-debug.apk
            release-assets/latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
